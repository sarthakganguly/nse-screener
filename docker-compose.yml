services:
  redis:
    image: redis:alpine
    container_name: nse_redis
    ports:
      - "6380:6379"
    restart: always

  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: nse_timescale
    environment:
      - POSTGRES_USER=nse_admin
      - POSTGRES_PASSWORD=nse_password
      - POSTGRES_DB=nse_analytics
    volumes:
      - timescale_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: always

  backend:
    build: ./backend
    container_name: nse_backend
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - DB_URL=postgresql://nse_admin:nse_password@timescaledb:5432/nse_analytics
      - ENABLE_LOGGING=true
    ports:
      - "8005:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - timescaledb
      - redis
    restart: always

  frontend:
    build: ./frontend
    container_name: nse_frontend
    env_file: .env
    environment:
      - VITE_API_URL=http://localhost:8005/api
    ports:
      - "5173:5173"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - backend
    restart: always

volumes:
  timescale_data:
