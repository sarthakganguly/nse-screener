services:
  redis:
    image: redis:alpine
    container_name: nse_redis
    network_mode: "host"
    restart: always

  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: nse_timescale
    environment:
      - POSTGRES_USER=nse_admin
      - POSTGRES_PASSWORD=nse_password
      - POSTGRES_DB=nse_analytics
    volumes:
      - timescale_data:/var/lib/postgresql/data
    network_mode: "host"
    restart: always

  backend:
    build: ./backend
    container_name: nse_backend
    network_mode: "host"
    env_file: .env
    depends_on:
      - timescaledb
      - redis
    restart: always

  frontend:
    build: ./frontend
    container_name: nse_frontend
    network_mode: "host"
    env_file: .env
    restart: always

volumes:
  timescale_data:
