services:
  redis:
    image: redis:alpine
    container_name: nse_redis
    # Note: host mode doesn't need ports mapped
    network_mode: "host"

  backend:
    build: ./backend
    container_name: nse_backend
    network_mode: "host"
    environment:
      - ENABLE_LOGGING=true
      - REDIS_HOST=127.0.0.1 # Since we are in host mode, Redis is at localhost
    depends_on:
      - redis

  frontend:
    build: ./frontend
    container_name: nse_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://192.168.1.100:8000